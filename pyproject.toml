[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hive-data"
version = "0.1.0"
description = "The one async data-access layer every hive service goes through"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
include = ["hive_data*"]

[tool.setuptools.package-data]
hive_data = ["schema/*.sql", "schema/steps/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
